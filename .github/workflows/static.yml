# Deploy the mosque website to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check --input-type=module < admin.js
          node --check --input-type=module < app.js
          node --check --input-type=module < module.js
          node --check --input-type=module < scripts/check-appwrite-public-api.mjs

      - name: Test media limits and YouTube URL handling
        run: node --test tests/media-helpers.test.js

      - name: Check Appwrite public API connection (non-blocking)
        run: node scripts/check-appwrite-public-api.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


